<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검증 결과 영수증</title>
<meta name="description" content="모바일신분증 검증 결과 영수증 시연. 가상 데이터, 데모용이에요.">
<!-- KRDS 대한민국 디지털 정부 디자인 시스템 (krds-uiux 1.1.0): 색·글자·간격 토큰과 버튼 컴포넌트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/krds-uiux@1.1.0/resources/cdn/krds.min.css">
<!-- KRDS 기본 서체 Pretendard GOV -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css">
<!-- 폰 프레임: devices.css 0.2.0 (MIT) iPhone 14 Pro -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devices.css@0.2.0/dist/devices.min.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:,">
<!-- QR 그리기 (없으면 QR 자리에 안내 문구) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<!-- QR 읽기: 손님 앱이 카메라 사진에서 매장 QR을 실제로 디코드 (jsQR 1.4.0, Apache-2.0) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <a class="skip-link" href="#main">본문 바로가기</a>

  <p class="demo-band" role="note"><strong>데모</strong>가상 데이터로 만든 시연 화면이에요. 실제 정부 서비스가 아니에요.<span class="band-more"> 모든 인물·기관·키는 가상이에요.</span></p>

  <header class="topbar">
    <div class="brand">
      <p class="brand-kicker">2026 모바일신분증 아이디어 공모전 · 개념 검증</p>
      <h1 class="brand-title">검증 결과 영수증</h1>
    </div>
    <nav class="scene-nav" aria-label="장면 선택">
      <ol id="sceneNav"></ol>
    </nav>
    <button type="button" class="krds-btn small tertiary drawer-toggle" id="btnDrawer" aria-expanded="false" aria-controls="drawer">기술 상세</button>
  </header>

  <main id="main" class="main" tabindex="-1">
    <section class="narr" aria-label="내레이션">
      <div class="narr-head"><p class="narr-meta" id="narrMeta"></p><div class="narr-tools" id="narrTools"></div></div>
      <p class="narr-text" id="narrText" aria-live="polite"></p>
    </section>

    <div class="phone-switch" id="phoneSwitch" role="tablist" aria-label="보고 있는 폰">
      <button type="button" role="tab" data-side="left" id="tabLeft" aria-controls="deviceLeft"></button>
      <button type="button" role="tab" data-side="right" id="tabRight" aria-controls="deviceRight"></button>
    </div>

    <section class="stage" id="stage" aria-label="시연 화면">
      <figure class="device-slot" id="deviceLeft" data-side="left">
        <figcaption class="device-label" id="labelLeft"></figcaption>
        <div class="phone-box">
          <div class="phone-scale">
            <div class="device device-iphone-14-pro device-black">
              <div class="device-frame"><iframe class="device-screen" id="screenLeft" src="phone.html?role=customer" title="왼쪽 폰 화면"></iframe></div>
              <div class="device-stripe"></div><div class="device-header"></div><div class="device-sensors"></div>
              <div class="device-btns"></div><div class="device-power"></div><div class="device-home"></div>
            </div>
          </div>
        </div>
      </figure>
      <div class="wire" id="wire" aria-live="polite"></div>
      <figure class="device-slot" id="deviceRight" data-side="right">
        <figcaption class="device-label" id="labelRight"></figcaption>
        <div class="phone-box">
          <div class="phone-scale">
            <div class="device device-iphone-14-pro device-black">
              <div class="device-frame"><iframe class="device-screen" id="screenRight" src="phone.html?role=store" title="오른쪽 폰 화면"></iframe></div>
              <div class="device-stripe"></div><div class="device-header"></div><div class="device-sensors"></div>
              <div class="device-btns"></div><div class="device-power"></div><div class="device-home"></div>
            </div>
          </div>
        </div>
      </figure>
    </section>

    <section class="compare" id="compare" aria-label="지금과 바뀐 뒤 비교" hidden></section>
  </main>

  <div class="controls" role="group" aria-label="시연 진행">
    <button type="button" class="krds-btn medium text" id="btnRestart">처음부터</button>
    <div class="controls-main">
      <button type="button" class="krds-btn medium tertiary" id="btnPrev" aria-keyshortcuts="ArrowLeft">이전</button>
      <span class="counter" id="counter"></span>
      <button type="button" class="krds-btn medium primary" id="btnNext" aria-keyshortcuts="ArrowRight">다음</button>
    </div>
    <button type="button" class="krds-btn medium secondary" id="btnPlay" aria-pressed="false">자동 재생</button>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <h2 class="drawer-title" id="drawerTitle">기술 상세</h2>
    <button type="button" class="krds-btn small text" id="btnDrawerClose">닫기</button>
  </div>
  <p class="drawer-lead">지금 장면에서 실제로 만든 데이터예요. 서명·해시·검사 결과는 이 브라우저에서 방금 계산한 값이에요.</p>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
</body>
</html>
